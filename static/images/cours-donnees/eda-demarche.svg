ext-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="80" dy="0.0">Objectif</tspan><tspan x="80" dy="15.0">Variables clés</tspan></text><rect x="160" y="110" width="120" height="60" rx="10" fill="#2563eb" stroke="#2563eb" stroke-width="1.8"/><text x="220.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="220.0" dy="0.0">2. Profilage</tspan></text><rect x="160" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="220" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="220" dy="0.0">shape, info()</tspan><tspan x="220" dy="15.0">isna().sum()</tspan></text><rect x="300" y="110" width="120" height="60" rx="10" fill="#0d9488" stroke="#0d9488" stroke-width="1.8"/><text x="360.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="360.0" dy="0.0">3. Univarié</tspan></text><rect x="300" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="360" dy="0.0">describe()</tspan><tspan x="360" dy="15.0">hist, boxplot</tspan></text><rect x="440" y="110" width="120" height="60" rx="10" fill="#0d9488" stroke="#0d9488" stroke-width="1.8"/><text x="500.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="500.0" dy="0.0">4. Bivarié</tspan></text><rect x="440" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="500" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="500" dy="0.0">corr()</tspan><tspan x="500" dy="15.0">scatter, groupby</tspan></text><rect x="580" y="110" width="120" height="60" rx="10" fill="#d97706" stroke="#d97706" stroke-width="1.8"/><text x="640.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="640.0" dy="0.0">5. Anomalies</tspan></text><rect x="580" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="640" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="640" dy="0.0">IQR, z-score</tspan><tspan x="640" dy="15.0">valeurs rares</tspan></text><rect x="720" y="110" width="120" height="60" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.8"/><text x="780.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="780.0" dy="0.0">6. Hypothèses</tspan></text><rect x="720" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="780" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="780" dy="0.0">Pistes à tester</tspan><tspan x="780" dy="15.0">nouvelles questions</tspan></text><rect x="860" y="110" width="120" height="60" rx="10" fill="#475569" stroke="#475569" stroke-width="1.8"/><text x="920.0" y="144.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="920.0" dy="0.0">7. Documenter</tspan></text><rect x="860" y="182" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="920" y="203.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" text-anchor="middle" fill="#0f172a" font-weight="normal"><tspan x="920" dy="0.0">Markdown</tspan><tspan x="920" dy="15.0">conclusions</tspan></text><line x1="143.0" y1="140.0" x2="157.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><line x1="283.0" y1="140.0" x2="297.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><line x1="423.0" y1="140.0" x2="437.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><line x1="563.0" y1="140.0" x2="577.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><line x1="703.0" y1="140.0" x2="717.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><line x1="843.0" y1="140.0" x2="857.0" y2="140.0" stroke="#475569" stroke-width="2" marker-end="url(#m_gray)"/><path d="M 780 108 C 780 50, 220 50, 220 106" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m_amber)"/><text x="500" y="54.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#d97706" font-weight="bold"><tspan x="500" dy="0.0">On itère : chaque découverte soulève de nouvelles questions</tspan></text><text x="500" y="274.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic"><tspan x="500" dy="0.0">Exploration = comprendre les données avant de les modéliser ou de les présenter</tspan></text><text x="500" y="304.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal"><tspan x="500" dy="0.0">Résultat attendu : des hypothèses, des problèmes de qualité repérés et des décisions documentées</tspan></text></svg>